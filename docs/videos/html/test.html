<!DOCTYPE html>
<html><head><style>
body { margin: 0; width: 1280px; height: 720px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; }
.box { width: 200px; height: 200px; background: #1677ff; border-radius: 16px; animation: fadeIn 1s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
</style></head><body><div class="box"></div></body></html>
